# GitHub Actions CI/CD workflow for Docker-based deployment
name: CI/CD Docker Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_FRONTEND: vanemarendajad32/ux-hell/frontend
  IMAGE_BACKEND: vanemarendajad32/ux-hell/backend
  IMAGE_PROMETHEUS: vanemarendajad32/ux-hell/prometheus
  IMAGE_GRAFANA: vanemarendajad32/ux-hell/grafana

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create .env.production
        run: |
          echo "NEXT_PUBLIC_API_URL=${{ secrets.PRODUCTION_API_URL }}" >> frontend/.env.production
      
      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/vanemarendajad32/ux-hell/frontend:latest

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/vanemarendajad32/ux-hell/backend:latest

      - name: Build and push prometheus image
        uses: docker/build-push-action@v7
        with:
          context: ./backend/monitoring/prometheus
          file: ./backend/monitoring/prometheus/Dockerfile
          push: true
          tags: ghcr.io/vanemarendajad32/ux-hell/prometheus:latest

      - name: Build and push grafana image
        uses: docker/build-push-action@v7
        with:
          context: ./backend/monitoring/grafana
          file: ./backend/monitoring/grafana/Dockerfile
          push: true
          tags: ghcr.io/vanemarendajad32/ux-hell/grafana:latest



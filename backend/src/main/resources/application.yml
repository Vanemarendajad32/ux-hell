spring:
  application:
    name: uihell-backend
  flyway:
    enabled: true

  datasource:
    url: jdbc:postgresql://postgres:5432/uihell
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

jwt:
  # Provide via env var in production. For HS256 this must decode to >= 32 bytes.
  # Example generation: `openssl rand -base64 48`
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  prometheus:
    metrics:
      export:
        enabled: true

app:
  cors:
    allowed-origins:
      - http://localhost:3000
  auth:
    cookie-name: ${AUTH_COOKIE_NAME:UIHELL_SESSION}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: uihell-backend
    metrics_path: /actuator/prometheus
    basic_auth:
      username: prometheus
      password_file: /etc/prometheus/secrets/prometheus_basic_auth_password
    static_configs:
      - targets:
          - backend:8080

